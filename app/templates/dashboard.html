{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="card">
  <h1>Welcome, {{ current_user.username }}</h1>
  <p class="muted">Member since {{ current_user.created_at.strftime('%Y-%m-%d') }}</p>  <p>Two-factor authentication:
    <strong>{{ 'Enabled' if current_user.is_2fa_enabled else 'Not enabled' }}</strong>
  </p>
</div>
{% endblock %}
